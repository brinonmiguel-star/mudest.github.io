<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lampshade Studio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ec;--card:#fff;--tx:#1d1b18;--mu:#6d675e;--ac:#c4631b;--bd:#e0dad0;--cv:#e9e4dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--tx:#f1ece4;--mu:#a39b8f;--ac:#e8893f;--bd:#37322c;--cv:#0f0e0d}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--tx:#f1ece4;--mu:#a39b8f;--ac:#e8893f;--bd:#37322c;--cv:#0f0e0d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 20px 6px}h1{margin:0;font:600 24px Georgia,serif}header p{margin:4px 0 0;color:var(--mu)}
main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:16px;padding:14px 20px 28px}
@media(max-width:820px){main{grid-template-columns:1fr}}
#view{background:var(--cv);border:1px solid var(--bd);border-radius:14px;height:min(70vh,640px);min-height:340px;position:relative;overflow:hidden;touch-action:none;cursor:grab}
#view canvas{display:block;width:100%;height:100%}#hint{position:absolute;left:12px;bottom:8px;color:var(--mu);font-size:12px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.row{display:grid;grid-template-columns:110px 1fr 52px;align-items:center;gap:8px;margin:7px 0}
.row label{color:var(--mu);font-size:13px}.row output{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
input[type=range]{width:100%;accent-color:var(--ac)}select,input[type=text],input[type=email]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
h2{font:600 13px system-ui;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:14px 0 4px}h2:first-child{margin-top:0}
.price{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px}.price b{font:600 28px Georgia,serif}.price span{color:var(--mu);font-size:13px}
button{font:inherit;padding:10px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.bt>*{flex:1}
#msg{margin-top:8px;font-size:13px;color:var(--mu);min-height:18px}#ord{display:none;margin-top:10px;gap:8px;flex-direction:column}
</style></head><body>
<header><h1>Lampshade Studio</h1><p>Design a clear PLA lampshade, see it live in 3D, and order it printed.</p></header>
<main>
<div id="view"><div id="hint">Drag to rotate</div></div>
<div class="panel">
<h2>Shape</h2><div id="g1"></div>
<h2>Texture</h2>
<div class="row"><label>Fin style</label><select id="ft" style="grid-column:2/4"><option value="0">Smooth waves</option><option value="1">Sharp fins</option><option value="2">Scallops</option><option value="3">Sawtooth</option><option value="4">Straight blades</option></select></div>
<div id="g2"></div>
<h2>Top</h2>
<div class="row"><label>Top style</label><select id="ct" style="grid-column:2/4"><option value="1">Dome</option><option value="0">Flat</option></select></div>
<div id="g3"></div>
<div class="price"><b id="pr">–</b><span id="gr"></span></div>
<div class="bt"><button id="stl">Download STL</button><button class="p" id="buy">Order this shade</button></div>
<div id="ord"><input type="text" id="nm" placeholder="Your name"><input type="email" id="em" placeholder="Email"><button class="p" id="send">Send order request</button></div>
<div id="msg"></div>
</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CFG={g1:[["bd","Bottom ⌀ (mm)",50,200,1,110],["h","Height (mm)",60,250,1,150],["ratio","Top ÷ bottom",.3,1.5,.01,.7],["bu","Bulge",-.4,.5,.01,0],["bc","Bulge count",1,5,1,1],["th","Wall (mm)",.8,2,.4,.8]],
g2:[["fc","Fin count",0,60,1,24],["fd","Fin depth (mm)",0,12,.5,4],["tw","Twist (°)",-360,360,5,90],["fw","Blade width",.05,.9,.05,.3]],
g3:[["ch","Dome height (mm)",5,100,1,30],["cs","Dome shape",1,2,.05,1.6],["hd","Top hole ⌀ (mm)",3,20,.5,6.5]]};
const P={ft:0,ct:1};
for(const g in CFG){const box=document.getElementById(g);for(const [k,l,a,b,s,v] of CFG[g]){P[k]=v;const r=document.createElement("div");r.className="row";r.innerHTML=`<label>${l}</label><input type="range" min="${a}" max="${b}" step="${s}" value="${v}"><output>${v}</output>`;const i=r.querySelector("input"),o=r.querySelector("output");i.oninput=()=>{P[k]=+i.value;o.textContent=i.value;sched()};box.appendChild(r)}}
for(const k of ["ft","ct"])document.getElementById(k).onchange=e=>{P[k]=+e.target.value;sched()};
function build(P,Q){
const {bd,h,ratio,fc:n,ft,fd,tw,bu,bc,th,ct,ch:chp,cs,fw,hd}=P,RV=Q.rv,NC=Q.nc,PI=Math.PI;
const rb=bd/2,rt=rb*ratio,sl=Math.atan2(Math.abs(rb-rt),h),to=th/Math.max(Math.cos(sl),.3),uf=n>0&&fd>0,rate=tw*PI/180/h,flat=ct==0;
const prof=u=>ft==0?.5-.5*Math.cos(2*PI*u):ft==1?1-Math.abs(2*u-1):ft==2?Math.abs(Math.sin(PI*u)):u;
const S=[];
if(!uf){for(let i=0;i<96;i++)S.push([2*PI*i/96,0])}
else if(ft==4){const w=Math.min(Math.max(fw,.05),.9),u1=(1-w)/2,u2=u1+w,e=.002,kg=Math.max(1,Math.max(8,Math.ceil(192/n))>>1);
for(let f=0;f<n;f++){const us=[];for(let k=0;k<kg;k++)us.push([u1*k/kg,0]);us.push([u1,0],[u1+e,1],[u2-e,1],[u2,0]);for(let k=1;k<kg;k++)us.push([u2+(1-u2)*k/kg,0]);for(const [u,v] of us)S.push([2*PI*(f+u)/n,v])}}
else{const per=Math.max(12,Math.ceil(96/n));for(let i=0;i<n*per;i++)S.push([2*PI*i/(n*per),prof((i%per)/per)])}
const M=S.length,base=t=>(rb+(rt-rb)*t)*(1+bu*Math.pow(Math.sin(bc*PI*t),2));
const ring=(z,b,amp,rot)=>S.map(([t,f])=>{const r=Math.max(b+(uf?fd*f*amp:0),.1),a=t+rot;return[r*Math.cos(a),r*Math.sin(a),z]});
const ih=flat?Math.max(h-th,1):h,minr=Math.max(base(ih/h)-to,.1),hr=Math.max(Math.min(hd/2,.8*minr),.5);
const circ=z=>S.map(([t])=>[hr*Math.cos(t),hr*Math.sin(t),z]);
const O=[],I=[];
for(let j=0;j<=RV;j++){const t=j/RV,zo=h*t,zi=ih*t,rot=rate*zo;O.push(ring(zo,base(t),1,rot));I.push(ring(zi,base(zi/h)-to,ft==4?0:1,rot))}
if(flat){O.push(circ(h));I.push(circ(ih))}
else{const c=Math.max(chp,th+.5),ci=Math.max(c-th,.3),p=Math.max(cs,.5),B1=base(1),B1i=Math.max(B1-to,.1),dt=1e-3,ms=(base(1)-base(1-dt))/(dt*h);
for(let k=1;k<=NC;k++){const s=Math.sin(.5*PI*k/NC),sc=Math.pow(Math.max(1-Math.pow(s,p),0),1/p),fa=s*Math.pow(1-s,2),zo=h+c*s,zi=h+ci*s,rot=rate*zo;
O.push(ring(zo,hr+(B1-hr)*sc+ms*c*fa,sc,rot));I.push(ring(zi,hr+(B1i-hr)*sc+ms*ci*fa,ft==4?0:sc,rot))}}
const V=[],T=[],nr=O.length;
for(const L of[O,I])for(const r of L)for(const v of r)V.push(v[0],v[1],v[2]);
const oi=(k,i)=>k*M+(i%M),ii=(k,i)=>nr*M+k*M+(i%M),q=(a,b,c,d)=>T.push(a,b,c,a,c,d);
for(let k=0;k<nr-1;k++)for(let i=0;i<M;i++){q(oi(k,i),oi(k,i+1),oi(k+1,i+1),oi(k+1,i));q(ii(k,i),ii(k+1,i),ii(k+1,i+1),ii(k,i+1))}
for(let i=0;i<M;i++){q(oi(nr-1,i),oi(nr-1,i+1),ii(nr-1,i+1),ii(nr-1,i));q(oi(0,i),ii(0,i),ii(0,i+1),oi(0,i+1))}
return{V:new Float32Array(V),T:new Uint32Array(T)}}
// ---- 3D view ----
const el=document.getElementById("view"),ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));el.prepend(ren.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,1,3000),grp=new THREE.Group();scene.add(grp);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7f70,.9));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(200,300,250);scene.add(dl);
const bulb=new THREE.PointLight(0xffc27a,.6,400);scene.add(bulb);
const mat=new THREE.MeshStandardMaterial({color:0xcfe6ee,transparent:true,opacity:.62,roughness:.25,metalness:0,side:THREE.DoubleSide,flatShading:true});
let mesh=null,cur=null,ry=.6,drag=false,lx=0;
function show(){const m=build(P,{rv:70,nc:30});cur=m;const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(m.V,3));g.setIndex(new THREE.BufferAttribute(m.T,1));g.computeBoundingBox();const H=g.boundingBox.max.z;g.translate(0,0,-H/2);
if(mesh){mesh.geometry.dispose();grp.remove(mesh)}mesh=new THREE.Mesh(g,mat);mesh.rotation.x=-Math.PI/2;grp.add(mesh);
const d=Math.max(H,P.bd*1.2)*2.4;cam.position.set(0,H*.25,d);cam.lookAt(0,0,0);bulb.position.set(0,-H*.2,0);
let vol=0;const V=m.V,T=m.T;for(let i=0;i<T.length;i+=3){const a=T[i]*3,b=T[i+1]*3,c=T[i+2]*3;vol+=V[a]*(V[b+1]*V[c+2]-V[b+2]*V[c+1])-V[a+1]*(V[b]*V[c+2]-V[b+2]*V[c])+V[a+2]*(V[b]*V[c+1]-V[b+1]*V[c])}
const gr=Math.abs(vol)/6/1000*1.24,pr=4+gr*.07+H*.01;m.price=pr;m.gr=gr;
document.getElementById("pr").textContent="≈ €"+pr.toFixed(2);document.getElementById("gr").textContent=Math.round(gr)+" g clear PLA · "+Math.round(H)+" mm tall"}
let tm;function sched(){clearTimeout(tm);tm=setTimeout(show,60)}
function size(){const w=el.clientWidth,h=el.clientHeight;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener("resize",size);size();
el.onpointerdown=e=>{drag=true;lx=e.clientX;el.setPointerCapture(e.pointerId)};el.onpointerup=()=>drag=false;
el.onpointermove=e=>{if(drag){ry+=(e.clientX-lx)*.01;lx=e.clientX}};
(function loop(){if(!drag)ry+=.003;grp.rotation.y=ry;ren.render(scene,cam);requestAnimationFrame(loop)})();
show();
// ---- STL + order ----
const msg=t=>document.getElementById("msg").textContent=t;
function stl(m){const T=m.T,V=m.V,n=T.length/3,b=new ArrayBuffer(84+n*50),dv=new DataView(b);dv.setUint32(80,n,true);let o=84;
for(let i=0;i<n;i++){const t=[T[i*3]*3,T[i*3+1]*3,T[i*3+2]*3],a=[0,1,2].map(j=>V[t[0]+j]),bb=[0,1,2].map(j=>V[t[1]+j]),c=[0,1,2].map(j=>V[t[2]+j]);
const u=bb.map((x,j)=>x-a[j]),v=c.map((x,j)=>x-a[j]);let nx=u[1]*v[2]-u[2]*v[1],ny=u[2]*v[0]-u[0]*v[2],nz=u[0]*v[1]-u[1]*v[0];const l=Math.hypot(nx,ny,nz)||1;
[nx/l,ny/l,nz/l,...a,...bb,...c].forEach(x=>{dv.setFloat32(o,x,true);o+=4});o+=2}return b}
document.getElementById("stl").onclick=()=>{msg("Building a high-resolution file…");setTimeout(()=>{const hi=build(P,{rv:160,nc:48}),bl=new Blob([stl(hi)],{type:"model/stl"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="lampshade.stl";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);msg("Saved.")},30)};
document.getElementById("buy").onclick=()=>{document.getElementById("ord").style.display="flex"};
const ORDER_EMAIL="mudest.made@gmail.com"; // <-- put YOUR email here
document.getElementById("send").onclick=()=>{const nm=document.getElementById("nm").value.trim(),em=document.getElementById("em").value.trim();
if(!nm||!em)return msg("Please add your name and email.");
const body="Name: "+nm+"\nEmail: "+em+"\nEstimate: €"+cur.price.toFixed(2)+" ("+Math.round(cur.gr)+" g clear PLA)\n\nDesign settings:\n"+JSON.stringify(P);
location.href="mailto:"+ORDER_EMAIL+"?subject="+encodeURIComponent("Lampshade order")+"&body="+encodeURIComponent(body);
msg("Your email app should open with the order details. Press send and we’ll confirm.")};
</script></body></html>
